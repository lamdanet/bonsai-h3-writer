# Checks every push and pull request on Windows: formatting, clippy, tests and a release build.
name: CI

on:
  push:
    # Branches only: version tags are built by release.yml.
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Format, clippy, test, build (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read the Rust version from rust-toolchain.toml
        id: toolchain
        shell: pwsh
        run: |
          # The one place that pins Rust, so a new stable release cannot turn CI red by itself.
          $match = Select-String -LiteralPath rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) {
            Write-Output '::error file=rust-toolchain.toml::No channel = "..." line found in rust-toolchain.toml.'
            exit 1
          }
          $channel = $match.Matches[0].Groups[1].Value
          Write-Output "Rust $channel (pinned in rust-toolchain.toml)"
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Rust ${{ steps.toolchain.outputs.channel }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: bonsai-h3-writer-windows-x64
          path: |
            target/release/bonsai-h3-writer.exe
            target/release/bh3.exe
          if-no-files-found: error
          retention-days: 7
