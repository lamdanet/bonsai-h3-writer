[package]
name = "bonsai-h3-writer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Desktop app + CLI that drives a local Bonsai 27B (llama-server) to write MiniMax H3 video prompts"
license = "MIT"
repository = "https://github.com/lamdanet/bonsai-h3-writer"
readme = "README.md"
default-run = "bonsai-h3-writer"

[lib]
name = "bh3"
path = "src/lib.rs"

[[bin]]
name = "bonsai-h3-writer"
path = "src/main.rs"

[[bin]]
name = "bh3"
path = "src/bin/bh3.rs"

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.31", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.15"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
regex = "1"
arboard = "3"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
